name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://comissia:comissia@localhost:5432/comissia
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comissia
          POSTGRES_PASSWORD: comissia
          POSTGRES_DB: comissia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comissia -d comissia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Check database migrations
        run: npm run db:check

      - name: Apply database migrations
        run: npm run db:migrate

      # Repetir prova que as migrações são idempotentes, e deixa o banco pronto
      # para os testes de integração.
      - name: Re-apply database migrations
        run: npm run db:migrate

      - name: Run database tests
        run: npm run test:db

      - name: Build application
        run: npm run build
